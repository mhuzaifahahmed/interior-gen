# Render Blueprint for Interior-Gen (FastAPI backend).
#
# HOW TO DEPLOY:
#   1. Push this file to GitHub (it's safe to commit - it contains NO secrets;
#      every real key below is `sync: false`, meaning YOU paste it into the
#      Render dashboard, it is never stored in git).
#   2. On https://render.com  ->  New  ->  Blueprint  ->  connect this repo.
#   3. Render reads this file and creates the web service. It will prompt you
#      for every `sync: false` value - paste them from your local .env.
#   4. First deploy gives you a URL like https://interior-gen.onrender.com
#      Set GOOGLE_REDIRECT_URI to  <that-url>/api/auth/google/callback  and add
#      the exact same URL under your Google Cloud OAuth client's "Authorized
#      redirect URIs" (or leave the two GOOGLE_* keys blank to disable Google
#      sign-in - username/password login still works).
#
# NOTES:
#   - STORAGE_BACKEND=s3, so generated images live in your S3 bucket and survive
#     restarts. Good.
#   - The SQLite DB (accounts/projects) sits on Render's ephemeral disk on the
#     free plan, so it RESETS on every redeploy. Fine for a live demo. To make it
#     persistent you'd attach a paid disk and point DATABASE_URL at it, or move to
#     a managed Postgres.
#   - Free instances sleep after ~15 min idle; the first request after that is
#     slow (cold start) then normal. Load the page a minute before demoing.

services:
  - type: web
    name: interior-gen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # --- Runtime / non-secret config (safe to hardcode here) ---
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: STORAGE_BACKEND
        value: s3
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.5-flash
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: OPENAI_IMAGE_QUALITY
        value: low
      - key: OPENAI_IMAGE_INPUT_FIDELITY
        value: low
      - key: OPENAI_HOUSE_INPUT_FIDELITY
        value: high
      - key: S3_REGION
        value: auto
      # Room-redesign image backend toggle - "openai" or "kaggle" (see
      # app/providers/kaggle.py). Hardcoded here (not a secret) since it's
      # just a mode switch, not a credential - flip to "openai" instantly by
      # editing this file if the Kaggle tunnel is down, no dashboard visit
      # needed. Leave as "openai" if you don't have a Kaggle model running.
      - key: IMAGE_PROVIDER
        value: kaggle

      # --- Secret: signs the login-session cookie. Render generates a strong
      #     random value for you; no need to paste anything. ---
      - key: SESSION_SECRET_KEY
        generateValue: true

      # --- Secrets: paste these into the Render dashboard from your local .env.
      #     They are NEVER committed to git (that's what sync: false means). ---
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MATERIALS_API_KEY_ECONOMICAL
        sync: false
      - key: GEMINI_MATERIALS_API_KEY_MID
        sync: false
      - key: GEMINI_MATERIALS_API_KEY_PREMIUM
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      # Optional fallback SerpApi key - app/providers/serpapi.py switches to
      # it automatically when the first key runs out of monthly credits.
      # Leave blank in the Render dashboard if you don't have a second key.
      - key: SERPAPI_API_KEY_2
        sync: false
      # Your Kaggle notebook's Cloudflare tunnel URL (app/providers/kaggle.py).
      # This is EPHEMERAL - it changes every time the notebook restarts, so
      # you'll need to come back and update it in the Render dashboard
      # whenever that happens. Only used when IMAGE_PROVIDER=kaggle above.
      - key: KAGGLE_API_URL
        sync: false

      # Set ONLY if you're deploying the frontend (static/) separately to
      # Vercel instead of letting this backend serve it (the default - see
      # app/main.py's index()). Enables CORS + cross-site session cookies for
      # exactly this origin. Full URL, no trailing slash, e.g.
      # https://your-app.vercel.app - leave blank in the dashboard if this
      # backend is serving the frontend itself.
      - key: FRONTEND_ORIGIN
        sync: false

      # --- S3 storage (AWS bucket in your .env). Leave S3_ENDPOINT_URL blank for
      #     real AWS S3; set it only for R2/other S3-compatible hosts. ---
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false

      # --- Google OAuth (optional). Leave CLIENT_ID/SECRET blank to disable
      #     "Continue with Google" - password login is unaffected. If you use it,
      #     set GOOGLE_REDIRECT_URI to  https://<your-app>.onrender.com/api/auth/google/callback
      #     AFTER the first deploy gives you the URL. ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
