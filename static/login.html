<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log in — Interior-Gen</title>
<style>
  @layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}}
  ::-webkit-scrollbar{display:none;}
  /* Chrome/Edge force a light autofill background (yellow/white) via an inset
     box-shadow trick that ordinary CSS can't override with background-color
     alone - this neutralizes it so autofilled fields stay on the dark theme. */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-text-fill-color: #e5e2e1;
    -webkit-box-shadow: 0 0 0px 1000px #131313 inset;
    box-shadow: 0 0 0px 1000px #131313 inset;
    transition: background-color 9999s ease-in-out 0s;
  }
</style>
<script src="https://cdn.tailwindcss.com"></script>

-caps":["12px",{"lineHeight":"1.2","letterSpacing":"0.15em","fontWeight":"600"}],"body-md":["16px",{"lineHeight":"1.6","fontWeight":"400"}],"display-lg-mobile":["40px",{"lineHeight":"1.2","letterSpacing":"-0.01em","fontWeight":"700"}],"body-lg":["18px",{"lineHeight":"1.6","fontWeight":"400"}],"technical-data":["14px",{"lineHeight":"1.4","fontWeight":"500"}],"headline-sm":["24px",{"lineHeight":"1.4","fontWeight":"500"}],"display-lg":["64px",{"lineHeight":"1.1","letterSpacing":"-0.02em","fontWeight":"700"}]}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body class="bg-background font-body-md text-on-surface">
<main class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="flex flex-col w-full items-center justify-center">
<div class="fixed inset-0 z-0 opacity-10 pointer-events-none overflow-hidden">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs><pattern height="100" id="grid" patternUnits="userSpaceOnUse" width="100"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e9c176" stroke-width="0.5"></path></pattern></defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
<div class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-background via-transparent to-background"></div>
</div>

<div class="relative z-10 w-full max-w-[480px] px-gutter py-section-gap">
<div class="mb-12 text-center">
<a href="/" class="inline-block mb-8">
<div class="w-16 h-16 border border-primary flex items-center justify-center transform rotate-45 group hover:rotate-90 transition-transform duration-700">
<span class="material-symbols-outlined text-primary -rotate-45 group-hover:scale-110 transition-transform">architecture</span>
</div>
</a>
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-on-background mb-4">Welcome Back</h1>
<p class="font-label-caps text-label-caps text-outline uppercase tracking-[0.3em]">Log in to Interior-Gen</p>
</div>

<form class="space-y-10" id="login-form">
<div class="relative group">
<label class="block font-label-caps text-label-caps text-outline mb-2 uppercase">Username or Email</label>
<div class="relative flex items-center border-b border-outline-variant group-focus-within:border-primary transition-colors duration-300">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors mr-3 pb-2">mail</span>
<input class="w-full bg-transparent border-none py-3 font-body-md text-on-background focus:outline-none focus:ring-0" id="identifier" required type="text"/>
</div>
</div>

<div class="relative group">
<div class="flex justify-between items-end mb-2">
<label class="block font-label-caps text-label-caps text-outline uppercase">Password</label>
</div>
<div class="relative flex items-center border-b border-outline-variant group-focus-within:border-primary transition-colors duration-300">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors mr-3 pb-2">lock</span>
<input class="w-full bg-transparent border-none py-3 font-body-md text-on-background focus:outline-none focus:ring-0" id="password" required type="password"/>
<button class="material-symbols-outlined text-outline hover:text-on-background transition-colors pb-2" id="toggle-password" type="button">visibility</button>
</div>
</div>

<p class="text-sm text-error hidden" id="login-error"></p>

<div class="pt-4">
<button class="w-full bg-primary py-5 px-8 flex items-center justify-between group overflow-hidden relative transition-all active:scale-[0.98]" id="login-submit" type="submit">
<span class="font-label-caps text-label-caps text-on-primary relative z-10 uppercase font-bold" id="login-submit-label">Log In</span>
<span class="material-symbols-outlined text-on-primary relative z-10 group-hover:translate-x-2 transition-transform">arrow_forward</span>
<div class="absolute inset-0 bg-primary-container translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
</button>
</div>
</form>

<div class="mt-16 text-center">
<p class="font-body-md text-outline">
New here?
<a class="text-primary font-label-caps text-label-caps ml-2 hover:underline tracking-widest" href="/signup">Create an account</a>
</p>
</div>
</div>

<div class="fixed bottom-margin-desktop right-margin-desktop hidden lg:flex flex-col items-end opacity-20 pointer-events-none select-none">
<div class="font-technical-data text-[10px] text-primary tracking-tighter">SESSION_PROTOCOL: SECURE</div>
<div class="font-technical-data text-[10px] text-primary tracking-tighter">INTERIOR-GEN / AURELIAN_MONOLITH</div>
</div>
</div>
</main>
<script>
  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("login-error");
  const submitBtn = document.getElementById("login-submit");
  const submitLabel = document.getElementById("login-submit-label");

  document.getElementById("toggle-password").addEventListener("click", (e) => {
    const input = document.getElementById("password");
    const isHidden = input.type === "password";
    input.type = isHidden ? "text" : "password";
    e.currentTarget.textContent = isHidden ? "visibility_off" : "visibility";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.add("hidden");
    submitBtn.disabled = true;
    submitLabel.textContent = "Logging in…";

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          identifier: document.getElementById("identifier").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || "Login failed.");
      }
      window.location.href = "/";
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove("hidden");
      submitBtn.disabled = false;
      submitLabel.textContent = "Log In";
    }
  });
</script>
</body>
</html>
