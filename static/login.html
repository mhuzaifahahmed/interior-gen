<body class="bg-background font-body-md text-on-surface">

<header class="fixed top-0 w-full z-50 bg-surface-container/95 backdrop-blur-xl border-b border-outline-variant/70">
<div class="h-20 max-w-container-max mx-auto px-margin-mobile lg:px-margin-desktop flex items-center justify-between">
<a href="/" class="font-headline-sm text-headline-sm tracking-tight text-on-surface">Interior&#8209;Gen</a>
<nav class="hidden md:flex items-center gap-margin-mobile">
<a href="/" class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary hover:underline underline-offset-4 transition-colors pb-1">HOME</a>
<a href="/" class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary hover:underline underline-offset-4 transition-colors pb-1">ROOM REDESIGN</a>
<a href="/" class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary hover:underline underline-offset-4 transition-colors pb-1">BUILD A HOUSE</a>
</nav>
</div>
</header>

<main class="pt-20 min-h-[70vh] flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="flex flex-col w-full items-center justify-center">
<div class="fixed inset-0 z-0 opacity-10 pointer-events-none overflow-hidden">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs><pattern height="100" id="grid" patternUnits="userSpaceOnUse" width="100"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="#3f7a61" stroke-width="0.5"></path></pattern></defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
<div class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-background via-transparent to-background"></div>
</div>

<div class="relative z-10 w-full max-w-[480px] px-gutter py-section-gap">
<div class="mb-12 text-center">
<a href="/" class="inline-block mb-8">
<div class="w-16 h-16 border border-primary flex items-center justify-center transform rotate-45 group hover:rotate-90 transition-transform duration-700">
<span class="material-symbols-outlined text-primary -rotate-45 group-hover:scale-110 transition-transform">architecture</span>
</div>
</a>
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-on-background mb-4">Welcome Back</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.3em]">Log in to Interior-Gen</p>
</div>

<form class="space-y-10" id="login-form">
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase">Username or Email</label>
<div class="relative flex items-center border-b border-outline-variant group-focus-within:border-primary group-focus-within:shadow-[0_4px_14px_-6px_rgba(63,122,97,0.4)] transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors mr-3 pb-2">mail</span>
<input class="w-full bg-transparent border-none py-3 font-body-md text-on-background focus:outline-none focus:ring-0" id="identifier" required type="text"/>
</div>
</div>

<div class="relative group">
<div class="flex justify-between items-end mb-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase">Password</label>
</div>
<div class="relative flex items-center border-b border-outline-variant group-focus-within:border-primary group-focus-within:shadow-[0_4px_14px_-6px_rgba(63,122,97,0.4)] transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors mr-3 pb-2">lock</span>
<input class="w-full bg-transparent border-none py-3 font-body-md text-on-background focus:outline-none focus:ring-0" id="password" required type="password"/>
<button class="material-symbols-outlined text-on-surface-variant hover:text-primary hover:scale-110 transition-all duration-200 pb-2" id="toggle-password" type="button">visibility</button>
</div>
</div>

<p class="text-sm text-error hidden" id="login-error"></p>

<div class="pt-4">
<button class="w-full bg-primary py-5 px-8 flex items-center justify-between group overflow-hidden relative shadow-md hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300 active:scale-[0.98]" id="login-submit" type="submit">
<span class="font-label-caps text-label-caps text-on-primary relative z-10 uppercase font-bold" id="login-submit-label">Log In</span>
<span class="material-symbols-outlined text-on-primary relative z-10 group-hover:translate-x-2 transition-transform">arrow_forward</span>
<div class="absolute inset-0 bg-primary-container translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
</button>
</div>
</form>

<div class="flex items-center gap-4 mt-8">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">OR</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>

<a href="/api/auth/google/login" class="mt-6 w-full flex items-center justify-center gap-3 py-4 px-8 border border-outline-variant bg-surface text-on-surface font-label-caps text-label-caps hover:shadow-md hover:-translate-y-0.5 transition-all duration-200">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
<path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.86 2.7-6.62z"/>
<path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
<path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
<path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
</svg>
<span class="font-medium">Continue with Google</span>
</a>

<div class="mt-16 text-center">
<p class="font-body-md text-on-surface-variant">
New here?
<a class="text-primary font-label-caps text-label-caps ml-2 hover:underline tracking-widest" href="/signup">Create an account</a>
</p>
</div>
</div>

</div>
</main>

<footer class="bg-surface-container border-t border-outline-variant/70 py-14 relative z-10">
<div class="max-w-container-max mx-auto px-margin-mobile lg:px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-4">
<div class="flex items-center gap-2 font-headline-sm text-headline-sm text-on-surface-variant">
Interior&#8209;Gen
</div>
<p class="font-body-md text-on-surface-variant text-sm">AI&#8209;generated visualizations for planning purposes.</p>
<p class="font-label-caps text-label-caps text-on-surface-variant">
<a href="/terms" class="hover:text-primary hover:underline underline-offset-4 transition-colors">Terms</a>
<span class="mx-2 opacity-40">&middot;</span>
<a href="/privacy" class="hover:text-primary hover:underline underline-offset-4 transition-colors">Privacy Policy</a>
</p>
</div>
</footer>

<script>
  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("login-error");
  const submitBtn = document.getElementById("login-submit");
  const submitLabel = document.getElementById("login-submit-label");

  // google_callback (app/main.py) redirects here with ?error=... on any
  // failure in the Google OAuth exchange (bad/expired code, state mismatch,
  // Google itself returning an error) - surface it in the same error slot
  // password-login failures use, rather than silently landing back on a
  // blank login page.
  if (new URLSearchParams(window.location.search).get("error") === "google_auth_failed") {
    errorEl.textContent = "Google sign-in failed. Please try again.";
    errorEl.classList.remove("hidden");
  }

  document.getElementById("toggle-password").addEventListener("click", (e) => {
    const input = document.getElementById("password");
    const isHidden = input.type === "password";
    input.type = isHidden ? "text" : "password";
    e.currentTarget.textContent = isHidden ? "visibility_off" : "visibility";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.add("hidden");
    submitBtn.disabled = true;
    submitLabel.textContent = "Logging in…";

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          identifier: document.getElementById("identifier").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || "Login failed.");
      }
      window.location.href = "/";
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove("hidden");
      submitBtn.disabled = false;
      submitLabel.textContent = "Log In";
    }
  });
</script>
</body>
</html>
