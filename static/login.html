<a href="/" class="flex items-center gap-3 shrink-0 pl-2">
<span class="font-headline-sm text-headline-sm tracking-tight text-on-night">Interior&#8209;Gen</span>
</a>
<nav class="hidden md:flex items-center gap-1">

</nav>

</div>
</div>
</div>

<main class="pt-28 min-h-[70vh] flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="flex flex-col w-full items-center justify-center">
<div class="fixed inset-0 z-0 opacity-10 pointer-events-none overflow-hidden">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs><pattern height="100" id="grid" patternUnits="userSpaceOnUse" width="100"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="#7A4712" stroke-width="0.5"></path></pattern></defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
<div class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-background via-transparent to-background"></div>
</div>

<div class="mb-12 text-center">

<div class="w-16 h-16 border border-primary flex items-center justify-center transform rotate-45 group hover:rotate-90 transition-transform duration-700">
<span class="material-symbols-outlined text-primary -rotate-45 group-hover:scale-110 transition-transform">architecture</span>
</div>
</a>
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-on-background mb-4">Welcome Back</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.3em]">Log in to Interior-Gen</p>
</div>

<!-- Clerk mounts its <SignIn/> widget here (email/password + "Continue with
     Google" both come from Clerk itself - see static/clerk-init.js and the
     script at the bottom of this page). Replaced the old hand-written form +
     /api/auth/login fetch entirely - Clerk owns signup/login/session
     issuance now, this backend only verifies the token it sends (see
     app/auth.py). -->
<div id="clerk-sign-in"></div>
<p class="text-sm text-error hidden mt-4" id="login-error"></p>
</div>

</div>
</main>

<footer class="bg-surface-container border-t border-outline-variant/70 py-14 relative z-10">
<div class="max-w-container-max mx-auto px-margin-mobile lg:px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-4">
<div class="flex items-center gap-2 font-headline-sm text-headline-sm text-on-surface-variant">
Interior&#8209;Gen
</div>
<p class="font-body-md text-on-surface-variant text-sm">AI&#8209;generated visualizations for planning purposes.</p>
<p class="font-label-caps text-label-caps text-on-surface-variant">
<a href="/static/terms.html" class="hover:text-primary hover:underline underline-offset-4 transition-colors">Terms</a>
<span class="mx-2 opacity-40">&middot;</span>
<a href="/static/privacy.html" class="hover:text-primary hover:underline underline-offset-4 transition-colors">Privacy Policy</a>
</p>
</div>
</footer>

<script>
  const errorEl = document.getElementById("login-error");

  clerkReady
    .then((Clerk) => {
      if (Clerk.user) {
        window.location.href = "/";
        return;
      }
      Clerk.mountSignIn(document.getElementById("clerk-sign-in"), {
        fallbackRedirectUrl: "/",
        signUpUrl: "/static/signup.html",
        appearance: { variables: { colorPrimary: "#7A4712" } },
      });
    })
    .catch((err) => {
      console.error(err);
      errorEl.textContent = "Sign-in is temporarily unavailable. Please try again shortly.";
      errorEl.classList.remove("hidden");
    });
</script>
