    box-shadow: 0 0 0px 1000px #131313 inset;
    transition: background-color 9999s ease-in-out 0s;
  }
  @keyframes fade-in-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

</style>

<div class="w-10 h-10 flex items-center justify-center bg-primary text-on-primary">

<span class="font-label-caps text-label-caps tracking-[0.2em] text-on-background opacity-80">INTERIOR-GEN</span>

<div class="relative z-20 max-w-xl">
<h2 class="font-display-lg text-display-lg-mobile text-on-background mb-unit">Precision in <br/><span class="italic text-primary">Every Line.</span></h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">Create your account to generate room redesigns and full concept builds, saved to your own project history.</p>

<div class="col-span-1 lg:col-span-5 flex flex-col justify-center py-margin-mobile lg:px-unit">
<div class="w-full max-w-md mx-auto">

<p class="font-body-md text-body-md text-on-surface-variant">Join Interior-Gen to start generating.</p>

<form class="space-y-8 mt-10" id="signup-form">
<div class="relative group">
<label class="block font-label-caps text-label-caps text-outline mb-2 transition-colors group-focus-within:text-primary">Full Name</label>
<input class="w-full bg-transparent border-b border-outline-variant py-3 font-body-md text-on-surface focus:outline-none focus:border-primary transition-all" id="full-name" type="text"/>
</div>

<div class="relative group">
<label class="block font-label-caps text-label-caps text-outline mb-2 transition-colors group-focus-within:text-primary">Email</label>
<input class="w-full bg-transparent border-b border-outline-variant py-3 font-body-md text-on-surface focus:outline-none focus:border-primary transition-all" id="email" required type="email"/>
</div>

<div class="relative group">
<label class="block font-label-caps text-label-caps text-outline mb-2 transition-colors group-focus-within:text-primary">Password</label>
<input class="w-full bg-transparent border-b border-outline-variant py-3 font-body-md text-on-surface focus:outline-none focus:border-primary transition-all" id="password" required type="password"/>
<p class="font-technical-data text-[10px] uppercase tracking-tighter text-outline mt-2">Minimum 8 characters</p>
</div>

<p class="text-sm text-error hidden" id="signup-error"></p>

<div class="pt-4 space-y-6">
<button class="group relative w-full bg-primary py-5 flex items-center justify-center gap-3 overflow-hidden transition-all active:scale-[0.98]" id="signup-submit" type="submit">
<span class="relative z-10 font-label-caps text-label-caps text-on-primary font-bold" id="signup-submit-label">Create Account</span>
<span class="material-symbols-outlined relative z-10 text-on-primary transition-transform group-hover:translate-x-1">arrow_forward</span>
<div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
</button>
<p class="font-body-md text-body-md text-on-surface-variant text-center">
Already have an account? <a class="text-primary hover:underline underline-offset-4 transition-all" href="/login">Log in</a>
</p>
</div>
</form>
</div>
</div>
</div>
</main>
<script>
  const form = document.getElementById("signup-form");
  const errorEl = document.getElementById("signup-error");
  const submitBtn = document.getElementById("signup-submit");
  const submitLabel = document.getElementById("signup-submit-label");

  // There's no username field in this form (dropped per request) - the
  // account still needs one (uniqueness + it names the user's S3 storage
  // prefix, see app/auth.py's validate_username), so it's derived from the
  // email's local part, sanitized to the required [a-z0-9_]{3,32} charset,
  // with a short random suffix to make collisions unlikely. If the backend
  // still rejects it as taken (409), retry once with a fresh suffix before
  // giving up - the user never needs to see or choose this value.
  function deriveUsername(email) {
    const base = email.split("@")[0].toLowerCase().replace(/[^a-z0-9_]/g, "_").slice(0, 24) || "user";
    const suffix = Math.random().toString(36).slice(2, 8);
    return `${base}_${suffix}`;
  }

  async function trySignup(email, password, fullName) {
    return fetch("/api/auth/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: deriveUsername(email),
        email,
        password,
        full_name: fullName || null,
      }),
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.add("hidden");
    submitBtn.disabled = true;
    submitLabel.textContent = "Creating…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const fullName = document.getElementById("full-name").value.trim();

    try {
      let res = await trySignup(email, password, fullName);
      if (res.status === 409) {
        res = await trySignup(email, password, fullName); // one retry with a fresh random suffix
      }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || "Signup failed.");
      }
      window.location.href = "/";
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove("hidden");
      submitBtn.disabled = false;
      submitLabel.textContent = "Create Account";
    }
  });
</script>
